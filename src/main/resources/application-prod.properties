# ---- Microservice base URIs (prod) ----
service.users.baseUri=https://users.example.com
service.auth.baseUri=https://auth.example.com
service.health.baseUri=https://api.example.com

# ---- Timeouts (ms) ----
http.connectTimeout=5000
http.readTimeout=20000
http.maxResponseTimeMs=2500

# ---- Auth ----
auth.type=oauth2
auth.bearer.token=${PROD_BEARER_TOKEN}
auth.oauth2.tokenUrl=https://auth.example.com/oauth/token
auth.oauth2.clientId=${PROD_OAUTH_CLIENT_ID}
auth.oauth2.clientSecret=${PROD_OAUTH_CLIENT_SECRET}
auth.oauth2.scope=read
auth.apikey.header=X-API-Key
auth.apikey.value=${PROD_API_KEY}

log.requests=false
log.responses=false
