# ---- Microservice base URIs (dev) ----
service.users.baseUri=https://jsonplaceholder.typicode.com
service.auth.baseUri=https://dev-auth.example.com
service.health.baseUri=https://dev.example.com

# ---- Timeouts (ms) ----
http.connectTimeout=5000
http.readTimeout=15000
http.maxResponseTimeMs=3000

# ---- Auth (pluggable) ----
auth.type=bearer
auth.bearer.token=dev-bearer-token-placeholder
auth.oauth2.tokenUrl=https://dev-auth.example.com/oauth/token
auth.oauth2.clientId=dev-client
auth.oauth2.clientSecret=dev-secret
auth.oauth2.scope=read write
auth.apikey.header=X-API-Key
auth.apikey.value=dev-api-key

# ---- Logging ----
log.requests=true
log.responses=true
