# ---- Microservice base URIs (staging) ----
service.users.baseUri=https://staging-users.example.com
service.auth.baseUri=https://staging-auth.example.com
service.health.baseUri=https://staging.example.com

# ---- Timeouts (ms) ----
http.connectTimeout=5000
http.readTimeout=20000
http.maxResponseTimeMs=4000

# ---- Auth ----
auth.type=bearer
auth.bearer.token=${STAGING_BEARER_TOKEN}
auth.oauth2.tokenUrl=https://staging-auth.example.com/oauth/token
auth.oauth2.clientId=${STAGING_OAUTH_CLIENT_ID}
auth.oauth2.clientSecret=${STAGING_OAUTH_CLIENT_SECRET}
auth.oauth2.scope=read write
auth.apikey.header=X-API-Key
auth.apikey.value=${STAGING_API_KEY}

log.requests=true
log.responses=true
